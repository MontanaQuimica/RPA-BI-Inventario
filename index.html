    <title>Atualização de dados</title>
    <!-- CSS, conteúdo e lógica ficam neste arquivo único para facilitar a distribuição. -->
    <style>
        /* Paleta e tipografia padrão usadas em toda a página. */
        :root {
            color-scheme: light;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #263445;
            background: #f4f7fa;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        * { box-sizing: border-box; }

        /* Centraliza horizontalmente a página e define a área mínima da janela. */
        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background: #f4f7fa;
            display: flex;
            justify-content: center;
        }

        .page-shell {
            width: 100%;
            max-width: 1120px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 0 32px;
            display: flex;
            flex-direction: column;
        }

        /* Cabeçalho da marca; a logo está embutida no HTML como base64. */
        .site-header {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #e3e9ef;
        }

        .brand-logo {
            width: clamp(170px, 24vw, 220px);
            max-height: 54px;
            display: block;
            object-fit: contain;
        }

        /* Área principal. O deslocamento compensa a altura do cabeçalho para
           centralizar o cartão em relação à tela inteira. */
        .layout {
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 56px 0;
            transform: translateY(-38px);
        }

        /* Cartão branco central com largura máxima e espaçamento interno. */
        .status-card {
            width: min(100%, 560px);
            margin: 0 auto;
            padding: 34px;
            border: 1px solid #e0e7ee;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 12px 32px rgba(30, 55, 80, 0.07);
            text-align: center;
        }

        /* Faixa que representa a integração Power Automate → Power BI. */
        .integration-flow {
            margin: 0 0 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .integration-chip {
            min-height: 34px;
            padding: 0 13px;
            display: inline-flex;
            align-items: center;
            border: 1px solid;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 650;
        }

        .integration-chip.automate {
            border-color: #8bb8e7;
            color: #005a9e;
            background: #d9eaff;
        }

        .integration-chip.powerbi {
            border-color: #e9c84c;
            color: #6b5600;
            background: #fff4c2;
        }

        .integration-arrow {
            width: 15px;
            height: 15px;
            color: #8ba0b5;
        }

        /* Separador e ícones para carregamento, sucesso e falha da solicitação. */
        .divider {
            height: 1px;
            margin-bottom: 25px;
            background: #edf1f5;
        }

        .state-icon-shell {
            width: 48px;
            height: 48px;
            margin: 0 auto 14px;
            display: grid;
            place-items: center;
        }

        .state-icon {
            width: 40px;
            height: 40px;
            display: none;
        }

        .success-icon { color: #21834f; }
        .error-icon { color: #c1433a; }
        .retry-icon { color: #327dc0; transform-origin: center; }
        body[data-state="loading"] #retry-icon,
        body[data-state="retrying"] #retry-icon {
            display: block;
            animation: icon-spin 1.2s linear infinite;
        }
        body[data-state="success"] #success-icon,
        body[data-state="error"] #error-icon { display: block; }

        @keyframes icon-spin {
            to { transform: rotate(360deg); }
        }

        /* Títulos e mensagem atualizados de acordo com o estado da API. */
        .card-title {
            margin: 0;
            color: #21364c;
            font-size: 25px;
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.025em;
        }

        .status-title {
            margin: 0 0 20px;
            color: #34495f;
            font-size: 15px;
            font-weight: 650;
        }

        body[data-state="success"] .status-title { color: #21834f; }
        body[data-state="error"] .status-title { color: #c1433a; }

        .message {
            max-width: 440px;
            margin: 0 auto;
            color: #68798c;
            font-size: 14px;
            line-height: 1.65;
        }

        /* Contagem regressiva exibida depois que a API aceita a solicitação. */
        .progress-section {
            margin-top: 22px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            border: 1px solid #e7edf3;
            border-radius: 14px;
            background: #f8fafc;
            text-align: left;
        }

        .progress-container {
            width: 70px;
            height: 70px;
            flex: 0 0 auto;
            position: relative;
        }

        .progress-container svg {
            width: 70px;
            height: 70px;
            transform: rotate(-90deg);
        }

        .progress-container circle { fill: none; stroke-width: 9; }
        .progress-container .track { stroke: #e2eaf1; }

        .progress-container .progress {
            stroke: #3285c5;
            stroke-linecap: round;
            stroke-dasharray: 314.16;
            stroke-dashoffset: 314.16;
            transition: stroke-dashoffset 0.35s linear;
        }

        body[data-state="success"] .progress-container .progress { stroke: #29945d; }

        .progress-text {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: #287dc1;
            font-size: 19px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        body[data-state="success"] .progress-text { color: #21834f; }

        .countdown {
            max-width: 255px;
            margin: 0;
            color: #5f7184;
            font-size: 12px;
            line-height: 1.55;
        }

        /* Botões de nova tentativa, Helpdesk e fechamento da janela. */
        .actions { margin-top: 22px; }

        .button {
            width: 100%;
            min-height: 44px;
            padding: 10px 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 9px;
            color: #fff;
            background: #287dc1;
            font: inherit;
            font-size: 13px;
            font-weight: 650;
            text-decoration: none;
            cursor: pointer;
        }

        .button:hover { background: #216da9; }

        .button-secondary {
            margin-top: 10px;
            color: #526579;
            background: #eef2f6;
        }

        .button-secondary:hover { background: #e5ebf1; }

        .button:focus-visible,
        a:focus-visible {
            outline: 3px solid rgba(40, 125, 193, 0.3);
            outline-offset: 3px;
        }

        .close-hint {
            margin: 12px 0 0;
            padding: 12px 14px;
            border: 1px solid #d7e3ef;
            border-radius: 10px;
            background: #f4f7fb;
            color: #52677d;
            font-size: 13px;
            line-height: 1.5;
        }

        [hidden] { display: none !important; }

        /* Ajustes para telas estreitas, como celulares. */
        @media (max-width: 600px) {
            .page-shell { padding: 0 18px; }
            .site-header { min-height: 66px; }
            .layout { padding: 34px 0; transform: translateY(-33px); }
            .status-card { padding: 28px 21px; border-radius: 15px; }
            .card-title { font-size: 23px; }
        }

        /* Respeita a preferência do sistema por menos animações. */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
</style>
</head>
<!-- data-state começa em loading e o JavaScript troca para retrying, success ou error. -->
<body data-state="loading">
    <div class="page-shell">
        <!-- Logo institucional da Montana, incorporada no próprio HTML. -->
        <header class="site-header">

    </div><script>
        const API_URL = "https://804e28eeb21ce5ac8c27736f0e7d4b.e1.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/02/workflows/82335bba1b304754adc8da249b25e4b5/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=bYhZve6gXklhBysDDPvdh7oZP6UoWx56CTHZFsf968Q";
        /*
         * API_URL guarda o endereço usado pela ação atual. Altere essa variável
         * para apontar a chamada para outro endpoint.
         *
         * API_ACTIONS é a matriz de ações: cada chave pode ser escolhida por
         * ?acao=chave. Sem esse parâmetro, DEFAULT_ACTION usa "orcamento".
         * Para incluir outro fluxo, adicione uma nova chave com título, URL,
         * método e mensagem de sucesso. headers e body são opcionais.
         * Exemplo: index.html?acao=orcamento
         *
         * A URL assinada fica visível no HTML para quem acessar o arquivo.
         * Para proteger a assinatura em uma distribuição ampla, use um servidor
         * intermediário (proxy) em vez de publicar o endereço no navegador.
         */

        // Parâmetros por ação: título, endpoint, método, mensagens e tempos.
        // timeoutSeconds vale para cada chamada; countdownSeconds só roda no sucesso.
        const API_ACTIONS = {
            orcamento: {
                title: "Atualização de dados", // Título principal do cartão.
                url: API_URL, // Endpoint acionado por esta ação.
                method: "GET", // Método HTTP usado na chamada.
                successMessage: "A solicitação foi aceita. Aguarde alguns minutos para a conclusão da atualização do conjunto de dados e, depois, atualize a página do Power BI.",
                countdownSeconds: 15, // Segundos até o fechamento automático após sucesso.
                timeoutSeconds: 30 // Limite de espera para cada chamada à API.
            }
        };

        // Ação padrão quando o endereço não contém ?acao=.
        const DEFAULT_ACTION = "orcamento";
        // Comprimento do caminho do círculo SVG, usado para calcular o progresso.
        const CIRCLE_CIRCUMFERENCE = 314.16;

        // Referências aos elementos que o JavaScript atualiza na página.
        const pageTitle = document.getElementById("page-title");
        const statusTitle = document.getElementById("status-title");
        const statusMessage = document.getElementById("status-message");
        const progressSection = document.getElementById("progress-section");
        const progressCircle = document.getElementById("progress-circle");
        const progressText = document.getElementById("progress-text");
        const countdownText = document.getElementById("countdown-text");
        const errorActions = document.getElementById("error-actions");
        const retryButton = document.getElementById("retry-button");
        const closeButton = document.getElementById("close-button");
        const closeHint = document.getElementById("close-hint");

        // Temporizadores e trava para impedir chamadas simultâneas.
        let countdownTimer = null;
        let autoCloseTimer = null;
        let requestInProgress = false;

        // Define o estado no body para acionar os estilos e atualizar os textos.
        function setState(state, title, message) {
            document.body.dataset.state = state;
            statusTitle.textContent = title;
            statusMessage.textContent = message;
        }

        // Tenta fechar a janela; se o navegador bloquear, mostra uma orientação clara.
        function closePage() {
            window.close();

            window.setTimeout(function () {
                if (!window.closed) {
                    closeButton.textContent = "Fechar esta aba";
                    closeButton.hidden = false;
                    countdownText.textContent = "O fechamento automático foi bloqueado. Clique no botão abaixo para tentar novamente.";
                    closeHint.textContent = "O navegador ainda pode impedir o fechamento por segurança.";
                    closeHint.hidden = false;
                }
            }, 250);
        }

        // Cancela contagem regressiva e fechamento automático pendentes.
        function stopCountdown() {
            if (countdownTimer !== null) {
                window.clearInterval(countdownTimer);
                countdownTimer = null;
            }
            if (autoCloseTimer !== null) {
                window.clearTimeout(autoCloseTimer);
                autoCloseTimer = null;
            }
        }

        // Atualiza o círculo a cada segundo e fecha a janela quando chega a zero.
        function startCountdown(seconds) {
            stopCountdown();
            progressSection.hidden = false;
            closeButton.hidden = false;

            const duration = Math.max(1, Number(seconds) || 20);
            let secondsRemaining = duration;

            function renderProgress() {
                const elapsedFraction = (duration - secondsRemaining) / duration;
                progressCircle.style.strokeDashoffset = String(CIRCLE_CIRCUMFERENCE * (1 - elapsedFraction));
                progressText.textContent = String(secondsRemaining);
                countdownText.textContent = secondsRemaining === 1
                    ? "Esta janela será fechada em 1 segundo."
                    : "Esta janela será fechada em " + secondsRemaining + " segundos.";
            }

            renderProgress();
            countdownTimer = window.setInterval(function () {
                secondsRemaining -= 1;
                renderProgress();

                if (secondsRemaining <= 0) {
                    stopCountdown();
                    countdownText.textContent = "Fechando a janela…";
                    autoCloseTimer = window.setTimeout(closePage, 800);
                }
            }, 1000);
        }

        // Lê ?acao= do endereço e busca a configuração correspondente na matriz.
        function getSelectedAction() {
            const query = new URLSearchParams(window.location.search);
            const requestedAction = (query.get("acao") || DEFAULT_ACTION).trim().toLowerCase();
            return {
                key: requestedAction,
                config: Object.prototype.hasOwnProperty.call(API_ACTIONS, requestedAction)
                    ? API_ACTIONS[requestedAction]
                    : null
            };
        }

        // Monta as opções do fetch com método, cabeçalhos e corpo opcionais.
        function buildRequestOptions(config) {
            const options = {
                method: config.method || "GET",
                cache: "no-store"
            };

            if (config.headers) {
                options.headers = config.headers;
            }

            if (config.body !== undefined && config.body !== null) {
                options.body = typeof config.body === "function" ? config.body() : config.body;
            }

            return options;
        }

        // Envia uma chamada com timeout próprio para cada tentativa.
        // Qualquer resposta fora da faixa HTTP 2xx é lançada como erro.
        async function sendApiRequest(config) {
            const controller = new AbortController();
            const timeoutMs = Math.max(1, Number(config.timeoutSeconds) || 30) * 1000;
            const timeoutId = window.setTimeout(function () {
                controller.abort();
            }, timeoutMs);

            try {
                const response = await fetch(config.url, {
                    ...buildRequestOptions(config),
                    signal: controller.signal
                });

                if (!response.ok) {
                    const error = new Error("HTTP " + response.status);
                    error.status = response.status;
                    throw error;
                }

                return response;
            } finally {
                window.clearTimeout(timeoutId);
            }
        }

        // Coordena a chamada, as tentativas de recuperação e a interface.
        async function runSelectedAction() {
            // Impede chamadas simultâneas e limpa a interface de uma falha
            // anterior antes de iniciar uma nova solicitação.
            if (requestInProgress) return;
            requestInProgress = true;

            stopCountdown();
            progressSection.hidden = true;
            errorActions.hidden = true;
            retryButton.hidden = true;
            retryButton.disabled = true;
            closeButton.hidden = true;
            closeHint.hidden = true;

            const selected = getSelectedAction();
            const config = selected.config;

            if (!config) {
                // Ação solicitada não cadastrada na matriz API_ACTIONS.
                pageTitle.textContent = "Ação não configurada";
                document.title = "Ação não configurada";
                errorActions.hidden = false;
                closeButton.hidden = false;
                setState(
                    "error",
                    "Não foi possível iniciar",
                    "A ação “" + selected.key + "” não está cadastrada neste arquivo. Confira o parâmetro acao do endereço."
                );
                requestInProgress = false;
                retryButton.disabled = false;
                return;
            }

            pageTitle.textContent = config.title || "Atualização de dados";
            document.title = pageTitle.textContent;
            setState("loading", "Solicitação em andamento", "Estamos iniciando a solicitação. Aguarde, por favor.");

            try {
                let automaticRetries = 0;

                while (true) {
                    try {
                        // Executa a chamada inicial ou a única repetição automática.
                        await sendApiRequest(config);
                        break;
                    } catch (error) {
                        // Só tenta novamente automaticamente no HTTP 502, uma
                        // vez e sem espera. A primeira chamada pode ter iniciado
                        // o fluxo mesmo com erro, então pode haver duplicidade.
                        if (error.status !== 502 || automaticRetries >= 1) {
                            throw error;
                        }

                        automaticRetries += 1;
                        setState(
                            "retrying",
                            "Tentando novamente automaticamente",
                            "O serviço respondeu com erro 502. Faremos mais uma tentativa agora."
                        );
                    }
                }

                // Resposta aceita: exibe sucesso e inicia a contagem regressiva.
                setState(
                    "success",
                    "Solicitação recebida",
                    config.successMessage || "A API aceitou a solicitação."
                );
                startCountdown(config.countdownSeconds);
            } catch (error) {
                // Se a última tentativa falhar, apresenta a mensagem e as ações.
                let message = "Não foi possível confirmar a solicitação. Verifique a conexão ou informe o Departamento de TI pelo Helpdesk.";
                let title = "Não foi possível iniciar";

                if (error.name === "AbortError") {
                    message = "A API não respondeu dentro do tempo esperado. Verifique o fluxo antes de tentar novamente.";
                } else if (error.status) {
                    message = "A API respondeu com o erro HTTP " + error.status + ". Informe esse código ao Departamento de TI pelo Helpdesk.";
                }

                if (error.status === 502) {
                    // Depois do retry automático, libera também a repetição manual.
                    title = "Instabilidade temporária no serviço";
                    message = "O serviço retornou erro 502. A solicitação pode ter sido iniciada mesmo sem confirmação. Aguarde alguns minutos e confira o Power BI; se os dados não atualizarem, você pode tentar novamente.";
                    retryButton.hidden = false;
                }

                errorActions.hidden = false;
                closeButton.hidden = false;
                setState("error", title, message);
            } finally {
                requestInProgress = false;
                retryButton.disabled = false;
            }
        }

        // Liga os botões e inicia a ação padrão ao carregar o arquivo.
        retryButton.addEventListener("click", runSelectedAction);
        closeButton.addEventListener("click", closePage);
        runSelectedAction();
    </script>
</body>
</html>
